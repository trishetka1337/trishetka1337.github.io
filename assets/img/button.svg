<svg xmlns="http://www.w3.org/2000/svg" width="88" height="31" viewBox="0 0 88 31" shape-rendering="crispEdges">
  <title>villcreat</title>
  <!-- Классическая кнопка 88x31. Всё внутри, шрифты системные моноширинные. -->
  <rect width="88" height="31" fill="#100e0c"/>
  <rect x="0.5" y="0.5" width="87" height="30" fill="none" stroke="#e0a45c" stroke-width="1"/>
  <rect x="2" y="2" width="84" height="27" fill="none" stroke="#2c251e" stroke-width="1"/>

  <!-- Значок слева -->
  <rect x="6" y="9" width="13" height="13" fill="#e0a45c"/>
  <rect x="9" y="12" width="7" height="7" fill="#100e0c"/>
  <rect x="11" y="14" width="3" height="3" fill="#e0a45c">
    <animate attributeName="opacity" values="1;0.15;1" dur="1.4s" repeatCount="indefinite"/>
  </rect>

  <text x="24" y="15" font-family="monospace" font-size="9" font-weight="bold" fill="#ece5db"
        letter-spacing="0.3">villcreat</text>
  <text x="24" y="24" font-family="monospace" font-size="6" fill="#a99e90"
        letter-spacing="0.4">SELF-HOSTED</text>
</svg>
