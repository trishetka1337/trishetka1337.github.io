name: build and deploy

on:
  push:
    branches: [main]
  schedule:
    # Каждые 30 минут обновляем живые данные.
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Собрать живые данные
        env:
          GH_USER: ${{ github.repository_owner }}
          # Имена репозиториев, которые не показывать. Через запятую.
          SKIP_REPOS: ${{ vars.SKIP_REPOS }}
          # GH_PAT нужен для графа контрибуций. Если его нет, берём штатный токен.
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          LASTFM_USER: ${{ secrets.LASTFM_USER }}
          LASTFM_KEY: ${{ secrets.LASTFM_KEY }}
          INFRA_TARGETS: ${{ secrets.INFRA_TARGETS }}
        run: python scripts/collect.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
